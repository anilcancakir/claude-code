name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # stop-guard-announce.sh needs ripgrep, and the runner image does not ship it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: cd cli/ac && bun install --frozen-lockfile

      - name: Typecheck
        run: cd cli/ac && bun run typecheck

      - name: Test
        run: cd cli/ac && bun test

      # The node:sqlite suites only run under Node; bun cannot load the binding.
      - name: Test (node:sqlite)
        run: cd cli/ac && bun run test:node

  opencode-ac:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Typecheck and test
        run: cd opencode/ac && bun install --frozen-lockfile && bun run typecheck && bun test
